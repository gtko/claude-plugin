<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">gtko / config</title>
  <desc id="banner-desc">Bannière : gtko / config, un graphe d'agents Haiku-first pour Claude Code</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Titre -->
  <text x="80" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">
    <tspan fill="#F5F1EA">gtko</tspan><tspan fill="#D97757"> / </tspan><tspan fill="#F5F1EA">config</tspan>
  </text>
  <rect x="80" y="180" width="120" height="6" rx="3" fill="#D97757"/>
  <text x="80" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#B8B2A7">Un graphe d'agents Haiku-first pour Claude Code</text>

  <!-- Motif : graphe d'agents -->
  <g stroke="#D97757" stroke-opacity="0.45" stroke-width="2" fill="none">
    <line x1="950" y1="150" x2="1070" y2="70"/>
    <line x1="950" y1="150" x2="1090" y2="150"/>
    <line x1="950" y1="150" x2="1070" y2="230"/>
    <line x1="1070" y1="70" x2="1160" y2="35"/>
    <line x1="1070" y1="70" x2="1165" y2="105"/>
    <line x1="1070" y1="230" x2="1160" y2="195"/>
    <line x1="1070" y1="230" x2="1170" y2="265"/>
  </g>
  <g fill="#2a2a31" stroke="#D97757" stroke-width="2">
    <circle cx="1070" cy="70" r="9"/>
    <circle cx="1090" cy="150" r="9"/>
    <circle cx="1070" cy="230" r="9"/>
    <circle cx="1160" cy="35" r="6"/>
    <circle cx="1165" cy="105" r="6"/>
    <circle cx="1160" cy="195" r="6"/>
    <circle cx="1170" cy="265" r="6"/>
  </g>
  <circle cx="950" cy="150" r="16" fill="#D97757"/>
</svg>
