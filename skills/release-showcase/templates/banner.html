<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release banner</title>
<!--
  Bannière de release, 1280 x 640 (Open Graph). Rendu par scripts/render.cjs avec 1280 640 2.
  Paramètres (query string ?clé=valeur, ou ?json=<objet JSON encodé>) :
    project      nom du projet (grand titre)
    version      libellé de version, ex. v0.1.0
    kicker       petit libellé au-dessus du titre (défaut : Release)
    tagline      accroche, 1 ou 2 phrases courtes
    bullets      3 puces max : tableau JSON, ou texte séparé par |
    url          ligne de pied de page (ex. github.com/owner/repo)
    image        image du bandeau inférieur (chemin local, URL ou data: URI) ; sans image, le bandeau disparaît
    accent       couleur principale (défaut #f28c28)
    accent2      couleur secondaire des halos (défaut #3b5ba5)
-->
<style>
  :root {
    --night: #141826;
    --night-2: #1d2440;
    --orange: #f28c28;
    --blue: #3b5ba5;
    --red: #c0392b;
    --cream: #f3e9d2;
    --accent: #f28c28;
    --accent2: #3b5ba5;
    --ink: #f3e9d2;
    --muted: rgba(243, 233, 210, 0.74);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--night); }
  body {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(620px 420px at 96% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%),
      radial-gradient(760px 520px at -6% 108%, color-mix(in srgb, var(--accent2) 60%, transparent), transparent 70%),
      linear-gradient(168deg, var(--night-2) 0%, var(--night) 58%, #0c1020 100%);
  }
  .grain {
    position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: soft-light; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .copy { position: absolute; left: 72px; top: 52px; width: 1000px; }
  .kicker { display: flex; align-items: center; gap: 14px; }
  .badge {
    font: 700 22px/1 var(--mono); letter-spacing: 0.02em;
    padding: 10px 16px 9px; border-radius: 999px;
    background: var(--accent); color: #1a1208;
    box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .label {
    font: 600 20px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  h1 {
    margin: 22px 0 0; font-size: 108px; line-height: 0.92; font-weight: 800; letter-spacing: -0.045em;
  }
  h1 .dot { color: var(--accent); }
  .tagline {
    margin: 18px 0 0; font-size: 29px; line-height: 1.3; font-weight: 500; color: var(--cream); max-width: 980px;
  }
  .ghost {
    position: absolute; right: 60px; top: 14px;
    font: 800 210px/1 var(--sans); letter-spacing: -0.06em;
    color: transparent; -webkit-text-stroke: 2px rgba(243, 233, 210, 0.16);
    font-variant-numeric: tabular-nums;
  }
  .foot {
    position: absolute; right: 72px; top: 236px;
    font: 500 18px/1 var(--mono); color: var(--muted); letter-spacing: 0.02em;
  }
  .chips {
    position: absolute; left: 72px; top: 304px;
    display: flex; gap: 14px; margin: 0; padding: 0; list-style: none;
  }
  .chips li {
    display: flex; align-items: center; gap: 12px;
    height: 50px; padding: 0 22px 0 18px; border-radius: 16px;
    background: rgba(243, 233, 210, 0.07);
    border: 1px solid rgba(243, 233, 210, 0.16);
    font-size: 21px; font-weight: 600; color: var(--cream); white-space: nowrap;
  }
  .chips li::before {
    content: ""; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 14px var(--accent);
  }
  .chips li:nth-child(2)::before { background: #8fa8e6; box-shadow: 0 0 14px #8fa8e6; }
  .chips li:nth-child(3)::before { background: var(--red); box-shadow: 0 0 14px var(--red); }
  .strip {
    position: absolute; left: 72px; right: 72px; top: 386px; height: 218px; margin: 0;
    border-radius: 22px; overflow: hidden;
    background: #0b0f1d;
    box-shadow: 0 34px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(243, 233, 210, 0.14);
  }
  .strip .bar {
    height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 16px;
    background: #1a2140; border-bottom: 1px solid rgba(243, 233, 210, 0.08);
  }
  .strip .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .strip .bar i:nth-child(1) { background: var(--red); }
  .strip .bar i:nth-child(2) { background: var(--accent); }
  .strip .bar i:nth-child(3) { background: var(--cream); opacity: 0.8; }
  .strip img {
    display: block; width: 100%; height: calc(100% - 30px); object-fit: cover; object-position: center 52%;
  }
  .strip.hidden { display: none; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>

  <div class="copy">
    <div class="kicker">
      <span class="badge" id="version">v0.1.0</span>
      <span class="label" id="kicker">Release</span>
    </div>
    <h1><span id="project">Project</span><span class="dot">.</span></h1>
    <p class="tagline" id="tagline"></p>
  </div>

  <div class="ghost" id="ghost" aria-hidden="true">0.1.0</div>
  <div class="foot" id="url"></div>
  <ul class="chips" id="bullets"></ul>

  <figure class="strip" id="strip">
    <div class="bar"><i></i><i></i><i></i></div>
    <img id="hero" alt="">
  </figure>

<script>
(function () {
  function readParams() {
    var q = new URLSearchParams(window.location.search);
    var d = {};
    var json = q.get('json');
    if (json) { try { d = JSON.parse(json); } catch (e) { d = {}; } }
    q.forEach(function (v, k) { if (k !== 'json') d[k] = v; });
    return d;
  }
  function toList(v) {
    if (Array.isArray(v)) return v;
    if (typeof v === 'string') return v.split('|').map(function (s) { return s.trim(); }).filter(Boolean);
    return [];
  }
  var p = readParams();
  var $ = function (id) { return document.getElementById(id); };
  var set = function (id, v) { if (v != null && v !== '') $(id).textContent = v; };

  if (p.accent) document.documentElement.style.setProperty('--accent', p.accent);
  if (p.accent2) document.documentElement.style.setProperty('--accent2', p.accent2);

  set('project', p.project);
  set('version', p.version);
  set('kicker', p.kicker);
  set('tagline', p.tagline);
  set('url', p.url);
  set('ghost', (p.version || '').replace(/^v/, ''));
  if (!p.version) $('ghost').hidden = true;

  var bullets = toList(p.bullets).slice(0, 3);
  $('bullets').innerHTML = '';
  bullets.forEach(function (b) {
    var li = document.createElement('li');
    li.textContent = b;
    $('bullets').appendChild(li);
  });

  var img = $('hero');
  if (p.image) {
    img.src = p.image;
  } else {
    $('strip').classList.add('hidden');
  }

  var pending = [];
  if (p.image) {
    pending.push(img.complete && img.naturalWidth > 0 ? Promise.resolve() : new Promise(function (res) {
      img.onload = res; img.onerror = res;
    }));
  }
  Promise.all(pending).then(function () { document.body.dataset.ready = '1'; });
})();
</script>
</body>
</html>
